packages:
  - 'apps/*'

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5
